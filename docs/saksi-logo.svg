<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Saksi">
  <title>Saksi</title>
  <rect width="512" height="512" rx="112" fill="#0B0F1A"/>

  <!-- witnessed: the public half of the record -->
  <path d="M124 256 Q 256 84 388 256" fill="none" stroke="#E9B949" stroke-width="24" stroke-linecap="round"/>

  <!-- concealed: the shielded half — present and counted, never readable -->
  <path d="M124 256 Q 256 428 388 256" fill="none" stroke="#E9B949" stroke-width="24"
        stroke-linecap="round" stroke-dasharray="1 39" opacity="0.6"/>

  <!-- the commitment -->
  <circle cx="256" cy="256" r="46" fill="#E9B949"/>
</svg>
